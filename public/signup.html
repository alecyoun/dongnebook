<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원 가입 - 동네북</title><link rel="stylesheet" href="/style.css"><script src="/config.js"></script><script src="/common.js"></script></head>
<body>
<div class="wrap"><div class="box" style="max-width:480px">
  <h1>회원 가입</h1>
  <p class="sub">동네북에 가입하고 이웃과 거래해 보세요.</p>
  <form id="f">
    <label for="email">이메일</label><input type="email" id="email" name="email" placeholder="example@email.com" required>
    <label for="username">아이디</label><input type="text" id="username" name="username" placeholder="영문, 숫자 4자 이상" required>
    <label for="password">비밀번호</label><input type="password" id="password" name="password" placeholder="6자 이상" required>
    <label for="nickname">닉네임</label><input type="text" id="nickname" name="nickname" placeholder="이웃에게 보일 이름" required>
    <label for="region">내 동네</label><select id="region" name="region"></select>
    <button class="btn green full" type="submit">가입하기</button>
    <div class="msg" id="msg"></div>
  </form>
  <p class="small">이미 회원인가요? <a href="/login">로그인</a></p>
</div></div>
<script>
header('');
document.getElementById('region').innerHTML = regionOptions('역삼동');
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  const body = Object.fromEntries(new FormData(e.target));
  const r = await fetch('/api/auth/signup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) { msg.className = 'msg err'; msg.textContent = '회원 가입에 실패했습니다. 잠시 후 다시 시도해 주세요.'; return; }
  const j = await r.json();
  msg.className = 'msg ok'; msg.textContent = j.message + ' 로그인해 주세요.';
};
</script>
</body></html>
