<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>판매글 - 동네북</title><link rel="stylesheet" href="/style.css"><script src="/config.js"></script><script src="/common.js"></script></head>
<body>
<div class="wrap"><div class="detail" id="d"></div></div>
<script>
header('home');
const id = location.pathname.split('/')[2];
async function load() {
  const p = await (await fetch('/api/products/' + id)).json();
  document.title = p.name + ' - 동네북';
  const mine = window.STAGE < 9 || (window.ME && window.ME.id === p.sellerId);
  const seller = window.STAGE >= 9 ? `<div class="seller"><div class="avatar">${esc((p.sellerNickname || '?')[0])}</div><div>판매자: <b>${esc(p.sellerNickname || '알 수 없음')}</b> · ${esc(p.region)}</div></div>` : '';
  const statusSel = mine ? `<div class="row" style="margin-top:6px"><span style="font-size:14px;color:#4a5650">거래 상태 변경</span>
      <select class="status-sel" id="st">${['판매중', '예약중', '거래완료'].map(s => `<option${s === p.status ? ' selected' : ''}>${s}</option>`).join('')}</select></div>` : '';
  const ownerBtns = window.STAGE >= 9 && mine ? `<div class="row" style="margin-top:16px"><a class="btn" href="/products/${p.id}/edit">수정</a><button class="btn red" onclick="del()">삭제</button></div>` : '';
  document.getElementById('d').innerHTML = `
    <div>${p.imageUrl ? `<img src="${p.imageUrl}" alt="">` : '<div class="noimg"></div>'}</div>
    <div>
      ${seller}
      <div class="row" style="margin-top:14px"><span class="badge s-${p.status}">${p.status}</span><span class="badge region">${esc(p.region)}</span><span class="meta">${ago(p.createdAt)}</span></div>
      <h1>${esc(p.name)}</h1>
      <div class="price">${won(p.price)}</div>
      ${statusSel}
      <div class="desc">${esc(p.description)}</div>
      ${ownerBtns}
      ${window.STAGE >= 9 && mine ? '' : '<button class="btn ask">판매자에게 문의하기</button>'}
    </div>`;
  const st = document.getElementById('st');
  if (st) st.onchange = async () => { const fd = new FormData(); fd.append('status', st.value); await fetch('/api/products/' + id, { method: 'PUT', body: fd }); load(); };
}
async function del() { if (!confirm('이 판매글을 삭제할까요?')) return; await fetch('/api/products/' + id, { method: 'DELETE' }); location.href = '/'; }
load();
</script>
</body></html>
