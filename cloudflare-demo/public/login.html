<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 - 동네북</title><link rel="stylesheet" href="/style.css"><script src="/config.js"></script><script src="/common.js"></script></head>
<body>
<div class="wrap"><div class="box" style="max-width:440px">
  <h1>로그인</h1>
  <p class="sub">동네북 데모에 오신 것을 환영합니다.</p>
  <form id="f">
    <label for="username">아이디</label><input type="text" id="username" name="username" placeholder="아이디" required>
    <label for="password">비밀번호</label><input type="password" id="password" name="password" placeholder="비밀번호" required>
    <button class="btn green full" type="submit">로그인</button>
    <div class="msg" id="msg"></div>
  </form>
  <div id="social"></div>
  <p class="small">데모에서는 회원 가입 대신 위의 체험용 계정을 눌러 로그인해 보세요. 다른 사람과 함께 쓰는 계정이에요.</p>
</div></div>
<script>
header('');
document.getElementById('social').innerHTML = `<div class="or">체험용 계정 (비밀번호 ${esc(window.DEMO_PASSWORD)})</div><div class="demo-accts">`
  + window.DEMO_ACCOUNTS.map(a => `<button type="button" class="btn" onclick="fill('${a.username}')"><b>${esc(a.nickname)}</b><span>${esc(a.username)} · ${esc(a.region)}</span></button>`).join('') + '</div>';
function fill(u) { document.getElementById('username').value = u; document.getElementById('password').value = window.DEMO_PASSWORD; }
const q = new URLSearchParams(location.search);
if (q.get('error')) { const m = document.getElementById('msg'); m.className = 'msg err'; m.textContent = q.get('error'); }
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.fromEntries(new FormData(e.target))) });
  const j = await r.json(); const m = document.getElementById('msg');
  if (!r.ok) { m.className = 'msg err'; m.textContent = j.error; return; }
  m.className = 'msg ok'; m.textContent = j.message;
  setTimeout(() => location.href = q.get('next') || '/', 600);
};
</script>
</body></html>
