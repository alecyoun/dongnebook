<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글쓰기 - 동네북</title><link rel="stylesheet" href="/style.css"><script src="/config.js"></script><script src="/common.js"></script></head>
<body>
<div class="wrap"><div class="box">
  <h1 id="t">판매글 쓰기</h1>
  <p class="sub">이웃에게 팔고 싶은 물건을 올려 보세요.</p>
  <form id="f">
    <label>사진</label>
    <div class="photo"><label class="ph" for="image" id="ph">사진 선택</label><input type="file" id="image" name="image" accept="image/*" style="display:none"><span class="meta" id="phm">대표 사진 1장</span></div>
    <div class="ai-note" id="ainote"></div>
    <label for="name">제목</label><input type="text" id="name" name="name" placeholder="예: 무선 키보드" required>
    <div id="catbox"></div>
    <label for="price">가격(원)</label><input type="number" id="price" name="price" placeholder="가격을 입력하세요" required>
    <label for="description">설명</label><textarea id="description" name="description" placeholder="물건의 상태, 사용 기간 등을 적어 주세요." required></textarea>
    <label for="region">동네</label><select id="region" name="region"></select>
    <button class="btn green full" type="submit" id="sb">등록</button>
  </form>
</div></div>
<script>
const editId = (location.pathname.match(/\/products\/(\d+)\/edit/) || [])[1];
header(editId ? 'home' : 'write');
const $ = (i) => document.getElementById(i);
$('region').innerHTML = regionOptions(window.ME ? window.ME.region : '역삼동');
$('image').onchange = e => { const f = e.target.files[0]; if (f && f.size > 2 * 1024 * 1024) { alert('사진은 2MB 이하로 올려 주세요.'); e.target.value = ''; return; } if (f) { $('ph').innerHTML = `<img src="${URL.createObjectURL(f)}">`; if (window.STAGE >= 12 && !editId) draft(f); } };
if (window.STAGE >= 12) {
  $('catbox').innerHTML = `<label for="category">카테고리</label><select id="category" name="category"><option value="">카테고리 선택</option>${window.CATEGORIES.map(c => `<option>${c}</option>`).join('')}</select>`;
  $('phm').textContent = '대표 사진 1장 · 사진을 올리면 AI가 초안을 써 드려요';
}
async function draft(f) {
  const n = $('ainote'); n.className = 'ai-note on'; n.textContent = 'AI가 사진을 보고 판매글 초안을 만들고 있어요…';
  const fd = new FormData(); fd.append('image', f);
  const r = await fetch('/api/ai/draft', { method: 'POST', body: fd });
  const d = await r.json().catch(() => ({ error: '초안을 만들지 못했습니다.' }));
  if (!r.ok) { n.textContent = d.error; return; }
  $('name').value = d.title; $('category').value = d.category; $('description').value = d.description;
  ['name', 'category', 'description'].forEach(i => $(i).classList.add('ai'));
  n.innerHTML = '<b>AI가 사진을 보고 제목, 카테고리, 설명 초안을 채웠어요.</b><br>사진으로 알 수 없는 내용(구입 시기, 흠집 등)은 확인해서 고쳐 주세요. 가격은 직접 입력해 주세요.';
  $('price').focus();
}
if (editId) {
  $('t').textContent = '판매글 수정'; $('sb').textContent = '수정';
  fetch('/api/products/' + editId).then(r => r.json()).then(p => { $('name').value = p.name; $('price').value = p.price; $('description').value = p.description; $('region').innerHTML = regionOptions(p.region); if (p.imageUrl) $('ph').innerHTML = `<img src="${p.imageUrl}">`; });
}
$('f').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch(editId ? '/api/products/' + editId : '/api/products', { method: editId ? 'PUT' : 'POST', body: new FormData(e.target) });
  const j = await r.json();
  if (!r.ok) return alert(j.error || '등록에 실패했습니다.');
  location.href = '/products/' + j.id;
};
</script>
</body></html>
