<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>상품 상세 페이지</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="text-gray-800 bg-white">

    <!-- 헤더 -->
    <header class="border-b border-gray-200 bg-blue-600">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between text-white">
            <div class="text-lg font-bold">
                SHOP LOGO
            </div>
            <nav>
                <ul class="flex gap-6 text-sm">
                    <li><a href="#" class="hover:underline">상품</a></li>
                    <li><a href="#" class="hover:underline">이벤트</a></li>
                    <li><a href="#" class="hover:underline">고객센터</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- 본문 -->
    <main class="py-10">
        <div class="max-w-5xl mx-auto px-4">
            <section class="flex gap-10">

                <!-- 상품 이미지 -->
                <div class="w-1/2 h-[400px] bg-gray-100 flex items-center justify-center">
                    <img 
                        src="sample.png" 
                        alt="상품 이미지"
                        class="max-w-full max-h-full object-contain"
                    >
                </div>

                <!-- 상품 정보 -->
                <div class="w-1/2 space-y-4">

                    <!-- 상품명 (기존 유지) -->
                    <h1 class="text-2xl font-bold">
                        상품명 예시
                    </h1>

                    <!-- 별점 (추가, 텍스트 영향 없음) -->
                    <div class="flex items-center gap-2 text-sm">
                        <div class="text-yellow-400">
                            ★★★★★
                        </div>
                        <span class="text-gray-600">(93)</span>
                    </div>

                    <!-- 가격 / 할인 (기존 가격 기준) -->
                    <div class="space-y-1">
                        <div class="flex items-center gap-3">
                            <span class="text-lg font-bold text-red-600">
                                10%
                            </span>
                            <span class="text-xl font-semibold text-red-600">
                                ₩44,100
                            </span>
                        </div>
                        <p class="text-sm text-gray-400 line-through">
                            ₩49,000
                        </p>
                    </div>

                    <!-- 상품 설명 (기존 유지) -->
                    <p class="text-gray-600 leading-relaxed mt-4">
                        이곳에 상품에 대한 간단한 설명이 들어갑니다.
                        주요 특징, 소재, 사용 방법 등을 간략히 작성합니다.
                    </p>

                    <!-- 장바구니 / 구매 (장바구니 유지) -->
                    <div class="flex gap-4 pt-6">
                        <button
                            class="w-1/2 h-14 border border-black text-base font-medium
                                   hover:bg-gray-100 transition">
                            장바구니 담기
                        </button>
                        <button
                            class="w-1/2 h-14 bg-black text-white text-base font-medium
                                   hover:bg-gray-800 transition">
                            구매하기
                        </button>
                    </div>

                </div>

            </section>
        </div>
    </main>

    <!-- 푸터 -->
    <footer class="border-t border-gray-200 mt-16 py-6 text-sm text-gray-500">
        <div class="max-w-5xl mx-auto px-4 text-center space-y-1">
            <p>© 2026 SHOP NAME. All rights reserved.</p>
            <p>사업자정보 · 이용약관 · 개인정보처리방침</p>
        </div>
    </footer>

</body>
</html>
