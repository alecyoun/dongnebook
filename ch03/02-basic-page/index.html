<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>상품 상세 페이지</title>
    <style>
        /* 공통 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #333;
            line-height: 1.5;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* 레이아웃 공통 */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* 헤더 */
        header {
            border-bottom: 1px solid #ddd;
        }

        header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        /* 메인 콘텐츠 */
        main {
            padding: 40px 0;
        }

        .product {
            display: flex;
            gap: 40px;
        }

        .product-image {
            width: 50%;
            background-color: #f5f5f5;
            height: 400px;
        }

        .product-info {
            width: 50%;
        }

        .product-info h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0;
        }

        .description {
            margin-bottom: 30px;
            color: #555;
        }

        .buy-button {
            display: inline-block;
            padding: 15px 30px;
            background-color: #000;
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        /* 푸터 */
        footer {
            border-top: 1px solid #ddd;
            padding: 20px 0;
            margin-top: 60px;
            font-size: 14px;
            color: #777;
        }

        footer .container {
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 헤더 -->
    <header>
        <div class="container">
            <div class="logo">SHOP LOGO</div>
            <nav>
                <ul>
                    <li><a href="#">상품</a></li>
                    <li><a href="#">이벤트</a></li>
                    <li><a href="#">고객센터</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- 본문 -->
    <main>
        <div class="container">
            <section class="product">
                <div class="product-image">
                    <!-- 상품 이미지 영역 -->
                </div>
                <div class="product-info">
                    <h1>상품명 예시</h1>
                    <div class="price">₩49,000</div>
                    <p class="description">
                        이곳에 상품에 대한 간단한 설명이 들어갑니다.
                        주요 특징, 소재, 사용 방법 등을 간략히 작성합니다.
                    </p>
                    <button class="buy-button">구매하기</button>
                </div>
            </section>
        </div>
    </main>

    <!-- 푸터 -->
    <footer>
        <div class="container">
            <p>© 2026 SHOP NAME. All rights reserved.</p>
            <p>사업자정보 · 이용약관 · 개인정보처리방침</p>
        </div>
    </footer>

</body>
</html>
