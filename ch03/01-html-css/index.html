<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>상품 페이지</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <h1 class="logo">SHOP LOGO</h1>
        <nav>
            <ul>
                <li><a href="#">상품</a></li>
                <li><a href="#">이벤트</a></li>
                <li><a href="#">문의</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="main">
        <section class="product">
            <img src="product-image.jpg" alt="상품 이미지" class="product-image">

            <div class="product-info">
                <h2 class="product-name">프리미엄 무선 헤드폰</h2>

                <p class="product-description">
                    뛰어난 음질과 편안한 착용감을 제공하는 프리미엄 무선 헤드폰입니다.
                    장시간 사용에도 부담 없이 사용할 수 있으며, 일상과 업무 모두에 적합합니다.
                </p>

                <p class="product-price">₩199,000</p>

                <button class="buy-button">구매하기</button>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 SHOP NAME. All rights reserved.</p>
    </footer>
</body>
</html>
